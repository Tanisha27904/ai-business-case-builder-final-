<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Business Case Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  body { margin: 0; font-family: 'Inter', sans-serif; }
  .serif { font-family: 'IBM Plex Serif', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  ::placeholder { opacity: 0.4; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

// ====== SET THIS TO YOUR CLOUDFLARE WORKER URL ======
const WORKER_URL = "https://my-worker.tanishakumar279.workers.dev";
// =====================================================

const TOKENS = {
  ink: "#10141F", paper: "#F7F8FA", navy: "#1F3864", steel: "#5B6B82",
  amber: "#C97A2B", green: "#2F6844", red: "#A23B3B", line: "#DDE1E8",
};

const FIELDS = [
  { key: "department", label: "Department", type: "text", placeholder: "e.g. Customer Success", col: 1 },
  { key: "businessProblem", label: "Business Problem", type: "textarea", placeholder: "What is the team struggling with?", col: 2 },
  { key: "currentProcess", label: "Current Process", type: "textarea", placeholder: "How is this handled today, step by step?", col: 2 },
  { key: "currentStack", label: "Current Software Stack", type: "text", placeholder: "e.g. Salesforce, Slack, Google Sheets", col: 2 },
  { key: "employees", label: "Employees Performing Task", type: "number", placeholder: "6", col: 1 },
  { key: "minutesPerTask", label: "Avg. Time Per Task (min)", type: "number", placeholder: "15", col: 1 },
  { key: "tasksPerDay", label: "Tasks Per Day (per employee)", type: "number", placeholder: "12", col: 1 },
  { key: "hourlyWage", label: "Avg. Hourly Wage ($)", type: "number", placeholder: "38", col: 1 },
  { key: "businessGoal", label: "Business Goal", type: "text", placeholder: "e.g. Reduce response time", col: 2 },
  { key: "painPoints", label: "Pain Points", type: "textarea", placeholder: "What breaks, stalls, or frustrates the team?", col: 2 },
  { key: "riskLevel", label: "Risk Level", type: "select", options: ["Low", "Medium", "High"], col: 1 },
  { key: "dataSensitivity", label: "Data Sensitivity", type: "select", options: ["Public", "Internal", "Confidential", "Regulated (PII/PCI/HIPAA)"], col: 1 },
  { key: "desiredOutcome", label: "Desired Outcome", type: "textarea", placeholder: "What does success look like in 90 days?", col: 2 },
];

function genCaseId() {
  return `AIB-2026-${Math.floor(1000 + Math.random() * 8999)}`;
}
function fmtMoney(n) {
  const num = Number(n);
  if (isNaN(num)) return n ?? "—";
  return num.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
}

function ScoreRing({ value = 0, label, color }) {
  const v = Math.max(0, Math.min(100, Number(value) || 0));
  const r = 34, c = 2 * Math.PI * r, offset = c - (v / 100) * c;
  return (
    <div className="flex flex-col items-center gap-2">
      <svg width="88" height="88" viewBox="0 0 88 88" className="-rotate-90">
        <circle cx="44" cy="44" r={r} fill="none" stroke={TOKENS.line} strokeWidth="7" />
        <circle cx="44" cy="44" r={r} fill="none" stroke={color} strokeWidth="7"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 900ms ease" }} />
      </svg>
      <div style={{ marginTop: "-4.4rem" }} className="flex flex-col items-center">
        <span className="font-mono text-xl font-semibold" style={{ color: TOKENS.ink }}>{v}</span>
      </div>
      <span className="text-[10px] uppercase tracking-[0.12em] text-center" style={{ color: TOKENS.steel, marginTop: "0.3rem" }}>{label}</span>
    </div>
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div className="p-5 flex flex-col gap-3" style={{ background: "white", border: `1px solid ${TOKENS.line}` }}>
      <div className="flex items-center justify-between">
        <span className="text-[10px] uppercase tracking-[0.14em]" style={{ color: TOKENS.steel }}>{label}</span>
        <span style={{ color: accent || TOKENS.steel }}>●</span>
      </div>
      <div className="font-mono text-2xl font-semibold" style={{ color: TOKENS.ink }}>{value}</div>
      {sub && <div className="text-xs" style={{ color: TOKENS.steel }}>{sub}</div>}
    </div>
  );
}

function Section({ eyebrow, title, children }) {
  return (
    <div className="mb-10">
      <div className="flex items-baseline gap-3 mb-4">
        <span className="mono text-xs" style={{ color: TOKENS.amber }}>{eyebrow}</span>
        <h3 className="text-sm uppercase tracking-[0.12em] font-semibold" style={{ color: TOKENS.ink }}>{title}</h3>
        <div className="flex-1 h-px" style={{ background: TOKENS.line }} />
      </div>
      {children}
    </div>
  );
}

function App() {
  const [form, setForm] = useState({
    department: "", businessProblem: "", currentProcess: "", currentStack: "",
    employees: "", minutesPerTask: "", tasksPerDay: "", hourlyWage: "",
    businessGoal: "", painPoints: "", riskLevel: "Medium",
    dataSensitivity: "Internal", desiredOutcome: "",
  });
  const [caseId, setCaseId] = useState("DRAFT");
  const [status, setStatus] = useState("idle");
  const [result, setResult] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");

  const update = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));
  const canSubmit = form.department.trim() && form.businessProblem.trim() && form.currentProcess.trim();

  async function handleEvaluate() {
    if (!canSubmit) return;
    setStatus("loading");
    setErrorMsg("");
    setCaseId(genCaseId());

    const systemPrompt = `You are a senior AI Strategy consultant at an enterprise SaaS company, evaluating internal AI project requests for a Business Case review. Your job is not to determine whether AI CAN do the task — it's to determine whether implementing AI makes BUSINESS SENSE: cost, ROI, risk, and effort.

Use this formula for current annual labor cost:
employees × tasksPerDay × minutesPerTask × 260 working days / 60 × hourlyWage

Be a skeptical, numerate consultant. Recommend 2 real, relevant SaaS/AI products only where genuinely relevant.

Respond with VALID JSON ONLY — must start with { and end with }. No markdown fences, no preamble. Schema:
{
  "executive_summary": "max 2 sentences",
  "problem_statement": "max 1 sentence",
  "current_cost_analysis": { "annual_hours": number, "annual_cost": number, "note": "max 1 sentence" },
  "estimated_ai_cost": { "monthly": number, "annual": number },
  "annual_savings": number,
  "roi": "e.g. 340%",
  "payback_period": "e.g. 4 months",
  "business_impact_score": number,
  "automation_score": number,
  "implementation_difficulty": "Low" | "Medium" | "High",
  "risk_score": number,
  "confidence_score": number,
  "recommended_solution": "max 1 sentence",
  "build_vs_buy": { "verdict": "Build" | "Buy" | "Hybrid", "reasoning": "max 1 sentence" },
  "implementation_cost": number,
  "maintenance_cost": number,
  "recommended_saas": [ { "name": "", "monthly_cost": "", "pros": ["",""], "cons": ["",""], "recommended": true } ],
  "implementation_plan": { "day_30": "", "day_60": "", "day_90": "" },
  "success_metrics": ["", "", ""],
  "executive_recommendation": { "verdict": "Proceed" | "Pilot" | "Hold", "summary": "max 2 sentences" }
}
Numbers must be plain numbers. Keep the whole response under 900 tokens.`;

    const userPrompt = `Department: ${form.department}
Business Problem: ${form.businessProblem}
Current Process: ${form.currentProcess}
Current Software Stack: ${form.currentStack || "Not specified"}
Employees Performing Task: ${form.employees || "0"}
Avg Time Per Task (minutes): ${form.minutesPerTask || "0"}
Tasks Per Day (per employee): ${form.tasksPerDay || "0"}
Avg Hourly Wage: ${form.hourlyWage || "0"}
Business Goal: ${form.businessGoal || "Not specified"}
Pain Points: ${form.painPoints || "Not specified"}
Risk Level: ${form.riskLevel}
Data Sensitivity: ${form.dataSensitivity}
Desired Outcome: ${form.desiredOutcome || "Not specified"}`;

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: userPrompt }],
        }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || "API error");
      const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
      const clean = text.replace(/```json|```/g, "").trim();
      const start = clean.indexOf("{"), end = clean.lastIndexOf("}");
      const parsed = JSON.parse(clean.slice(start, end + 1));
      setResult(parsed);
      setStatus("done");
    } catch (err) {
      setErrorMsg(err.message);
      setStatus("error");
    }
  }

  function reset() { setStatus("idle"); setResult(null); setCaseId("DRAFT"); }

  const inputClass = "w-full bg-transparent border-0 border-b py-2 text-sm outline-none focus:border-b-2 transition-all";

  return (
    <div className="min-h-screen w-full" style={{ background: TOKENS.paper, color: TOKENS.ink }}>
      <div className="border-b" style={{ borderColor: TOKENS.line }}>
        <div className="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between">
          <div className="flex items-baseline gap-3">
            <span className="serif text-lg font-semibold tracking-tight">AI Business Case Builder</span>
            <span className="text-xs hidden sm:inline" style={{ color: TOKENS.steel }}>Internal Strategy Review</span>
          </div>
          <div className="mono text-xs px-3 py-1.5" style={{ border: `1px solid ${TOKENS.line}`, color: status === "idle" ? TOKENS.steel : TOKENS.navy }}>
            CASE {caseId}
          </div>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-6 py-10">
        {status !== "done" && (
          <>
            <div className="mb-10">
              <span className="mono text-xs" style={{ color: TOKENS.amber }}>01 — INTAKE</span>
              <h1 className="serif text-3xl mt-2 mb-2">Submit an AI project request</h1>
              <p className="text-sm max-w-2xl" style={{ color: TOKENS.steel }}>
                This determines whether implementing AI makes business sense — not whether AI can technically do the task.
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-6 mb-8">
              {FIELDS.map((f) => (
                <div key={f.key} className={f.col === 2 ? "sm:col-span-2" : ""}>
                  <label className="block text-[10px] uppercase tracking-[0.12em] mb-1.5" style={{ color: TOKENS.steel }}>{f.label}</label>
                  {f.type === "textarea" ? (
                    <textarea rows={2} className={inputClass} style={{ borderColor: TOKENS.line }} placeholder={f.placeholder} value={form[f.key]} onChange={update(f.key)} />
                  ) : f.type === "select" ? (
                    <select className={inputClass} style={{ borderColor: TOKENS.line }} value={form[f.key]} onChange={update(f.key)}>
                      {f.options.map((o) => <option key={o} value={o}>{o}</option>)}
                    </select>
                  ) : (
                    <input type={f.type} className={inputClass} style={{ borderColor: TOKENS.line }} placeholder={f.placeholder} value={form[f.key]} onChange={update(f.key)} />
                  )}
                </div>
              ))}
            </div>

            {status === "error" && (
              <div className="mb-6 text-sm" style={{ color: TOKENS.red }}>⚠ {errorMsg}</div>
            )}

            <button onClick={handleEvaluate} disabled={!canSubmit || status === "loading"}
              className="px-6 py-3 text-sm font-medium"
              style={{ background: TOKENS.navy, color: TOKENS.paper, opacity: !canSubmit ? 0.4 : 1 }}>
              {status === "loading" ? "Running analysis…" : "Evaluate AI Opportunity →"}
            </button>
          </>
        )}

        {status === "done" && result && (
          <div>
            <div className="flex items-center justify-between mb-8">
              <span className="mono text-xs" style={{ color: TOKENS.amber }}>02 — BUSINESS CASE</span>
              <button onClick={reset} className="text-xs underline" style={{ color: TOKENS.steel }}>Start new evaluation</button>
            </div>

            <div className="p-8 mb-10" style={{ background: TOKENS.ink, color: TOKENS.paper }}>
              <div className="flex items-center gap-2 mb-3">
                <span className="mono text-[10px] uppercase tracking-[0.14em] px-2 py-1" style={{
                  background: result.executive_recommendation?.verdict === "Proceed" ? TOKENS.green :
                    result.executive_recommendation?.verdict === "Hold" ? TOKENS.red : TOKENS.amber }}>
                  {result.executive_recommendation?.verdict || "Reviewed"}
                </span>
                <span className="text-xs opacity-60">Executive Recommendation</span>
              </div>
              <p className="serif text-xl leading-snug mb-4">{result.executive_recommendation?.summary}</p>
              <p className="text-sm opacity-70 max-w-3xl">{result.executive_summary}</p>
            </div>

            <Section eyebrow="03" title="Problem Statement">
              <p className="text-sm max-w-3xl">{result.problem_statement}</p>
            </Section>

            <Section eyebrow="04" title="Financial Case">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <StatCard label="Annual Cost Today" value={fmtMoney(result.current_cost_analysis?.annual_cost)} sub={`${result.current_cost_analysis?.annual_hours ?? "—"} hrs/yr`} accent={TOKENS.steel} />
                <StatCard label="Annual Savings" value={fmtMoney(result.annual_savings)} accent={TOKENS.green} />
                <StatCard label="ROI" value={result.roi} accent={TOKENS.navy} />
                <StatCard label="Payback Period" value={result.payback_period} accent={TOKENS.amber} />
                <StatCard label="Implementation Cost" value={fmtMoney(result.implementation_cost)} accent={TOKENS.steel} />
                <StatCard label="Maintenance Cost / yr" value={fmtMoney(result.maintenance_cost)} accent={TOKENS.steel} />
                <StatCard label="Est. AI Cost / mo" value={fmtMoney(result.estimated_ai_cost?.monthly)} accent={TOKENS.steel} />
                <StatCard label="Build vs. Buy" value={result.build_vs_buy?.verdict} sub={result.build_vs_buy?.reasoning} accent={TOKENS.steel} />
              </div>
            </Section>

            <Section eyebrow="05" title="Scorecard">
              <div className="flex flex-wrap gap-x-10 gap-y-6">
                <ScoreRing value={result.business_impact_score} label="Business Impact" color={TOKENS.navy} />
                <ScoreRing value={result.automation_score} label="AI Suitability" color={TOKENS.green} />
                <ScoreRing value={result.risk_score} label="Risk" color={TOKENS.red} />
                <ScoreRing value={result.confidence_score} label="Confidence" color={TOKENS.amber} />
              </div>
              <div className="mt-4 text-xs" style={{ color: TOKENS.steel }}>
                Implementation difficulty: <span style={{ color: TOKENS.ink, fontWeight: 600 }}>{result.implementation_difficulty}</span>
              </div>
            </Section>

            {result.recommended_saas?.length > 0 && (
              <Section eyebrow="06" title="Recommended Tools">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {result.recommended_saas.map((tool, i) => (
                    <div key={i} className="p-4" style={{ background: "white", border: `1px solid ${TOKENS.line}` }}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm font-semibold">{tool.name}</span>
                        {tool.recommended && <span style={{ color: TOKENS.green }}>✓</span>}
                      </div>
                      <div className="mono text-xs mb-3" style={{ color: TOKENS.steel }}>{tool.monthly_cost}</div>
                      <ul className="text-xs space-y-1 mb-2">{(tool.pros || []).map((p, j) => <li key={j}>+ {p}</li>)}</ul>
                      <ul className="text-xs space-y-1" style={{ color: TOKENS.steel }}>{(tool.cons || []).map((c, j) => <li key={j}>− {c}</li>)}</ul>
                    </div>
                  ))}
                </div>
              </Section>
            )}

            <Section eyebrow="07" title="Rollout Plan">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {[["Day 30", result.implementation_plan?.day_30], ["Day 60", result.implementation_plan?.day_60], ["Day 90", result.implementation_plan?.day_90]].map(([label, val], i) => (
                  <div key={i} className="p-4" style={{ background: "white", border: `1px solid ${TOKENS.line}` }}>
                    <div className="mono text-xs mb-2" style={{ color: TOKENS.amber }}>{label}</div>
                    <div className="text-sm">{val}</div>
                  </div>
                ))}
              </div>
            </Section>

            <Section eyebrow="08" title="Success Metrics">
              <div className="flex flex-wrap gap-2">
                {(result.success_metrics || []).map((m, i) => (
                  <span key={i} className="text-xs px-3 py-1.5" style={{ border: `1px solid ${TOKENS.line}`, background: "white" }}>◆ {m}</span>
                ))}
              </div>
            </Section>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
